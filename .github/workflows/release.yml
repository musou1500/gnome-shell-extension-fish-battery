# Pushing a tag such as v1 creates a GitHub release with the extension zip.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same files as `gnome-extensions pack --extra-source=battery.js --extra-source=fish-symbolic.svg`.
      - name: Build zip
        run: zip fish-battery@musou1500.github.io.shell-extension.zip metadata.json extension.js battery.js fish-symbolic.svg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fish-battery@musou1500.github.io.shell-extension.zip --generate-notes
